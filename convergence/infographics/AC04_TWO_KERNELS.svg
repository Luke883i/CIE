<title id="t">CIE AC-04: two verifiable engines with a blocked semantic junction</title><desc id="d">Left: canonical F7, one player with simulated actors and eight economic turns, now persisted in SQLite. Right: AC03 Golden Crisis, five player roles with one shared simultaneous turn. The central connection is blocked until a multi-actor canonical model, common ledger, competence mapping, provenance and migration exist.</desc>
<rect width="1240" height="700" fill="#081b30"/><text x="66" y="74" fill="#e2d9c9" font-size="32" font-family="system-ui" font-weight="800">CIE / AC-04 · DUE MOTORI, UN CONFINE DI VERITÀ</text><text x="66" y="112" fill="#9ab5c8" font-size="17" font-family="system-ui">Consolidamento verificabile, senza dichiarare una fusione inesistente</text>
<rect x="60" y="155" width="488" height="350" rx="19" fill="#163c5c" stroke="#6895b5" stroke-width="3"/><text x="88" y="202" fill="#f2d5a4" font-size="26" font-family="system-ui" font-weight="800">CIE / F7 · CANONICO</text><text x="88" y="241" fill="#fff" font-size="18" font-family="system-ui">1 giocatore + NPC</text><text x="88" y="274" fill="#fff" font-size="18" font-family="system-ui">Preludio + 8 trimestri</text><text x="88" y="307" fill="#fff" font-size="18" font-family="system-ui">Regole F7 immutate</text><rect x="90" y="340" width="420" height="98" rx="11" fill="#0b2942"/><text x="115" y="371" fill="#a6d6f0" font-size="17" font-family="system-ui">SQLite WAL · replay F7 · token per ruolo</text><text x="115" y="404" fill="#a6d6f0" font-size="17" font-family="system-ui">HTTP locale · idempotenza · crash test</text><text x="91" y="477" fill="#95d7bd" font-size="16" font-family="system-ui">PASS locale sui test eseguiti</text>
<rect x="692" y="155" width="488" height="350" rx="19" fill="#1c344b" stroke="#6895b5" stroke-width="3"/><text x="722" y="202" fill="#f2d5a4" font-size="26" font-family="system-ui" font-weight="800">AC-03 · GOLDEN CRISIS</text><text x="722" y="241" fill="#fff" font-size="18" font-family="system-ui">5 volontà umane nello stesso turno</text><text x="722" y="274" fill="#fff" font-size="18" font-family="system-ui">1 trimestre, microkernel AC-02</text><text x="722" y="307" fill="#fff" font-size="18" font-family="system-ui">Risoluzione simultanea sperimentale</text><rect x="724" y="340" width="420" height="98" rx="11" fill="#0b2942"/><text x="749" y="371" fill="#a6d6f0" font-size="17" font-family="system-ui">SQLite WAL · 5 identità · una ricevuta</text><text x="749" y="404" fill="#a6d6f0" font-size="17" font-family="system-ui">Sospensione · credito · viste filtrate</text><text x="722" y="477" fill="#95d7bd" font-size="16" font-family="system-ui">Regressione congelata AC-03</text>
